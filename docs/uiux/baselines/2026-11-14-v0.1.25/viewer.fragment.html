    const option = document.createElement('option');
    option.value = scene;
    option.textContent = scene.slice(0, 2) + ' · ' + locale.scenes[scene];
    sceneControl.appendChild(option);
  });

  function restore(snapshot) {
    const saved = snapshot?.privateContent ?? snapshot?.modelContent ?? {};
    if (sceneSet.has(saved.scene)) state.scene = saved.scene;
    if (views.has(saved.view)) state.view = saved.view;
  }

  function render() {
    root.dataset.view = state.view;
    sceneControl.value = state.scene;
    viewControl.value = state.view;
    current.textContent = format(locale.current, { page: locale.scenes[state.scene], count: data.scenes.length });
    ['pw6', 'scribe'].forEach(profile => {
      const shot = data.screenshots[profile][state.scene];
      const image = document.getElementById('kindle-image-' + profile);
      image.src = data.assets[shot.asset];
      image.alt = format(locale.image_alt, { device: locale[profile], page: locale.scenes[state.scene] });
      image.width = shot.preview_width;
      image.height = shot.preview_height;
      image.dataset.scene = state.scene;
      document.getElementById('kindle-label-' + profile).textContent =
        locale[profile] + ' · ' + shot.width + ' × ' + shot.height;
    });
  }

  function remember() {
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState({
        modelContent: { scene: state.scene, view: state.view, source_commit: data.source_commit },
        privateContent: { ...state }
      }).catch(() => {});
    }
  }

  sceneControl.addEventListener('change', () => {
    state.scene = sceneControl.value;
    render();
    remember();
  });
  viewControl.addEventListener('change', () => {
    state.view = viewControl.value;
    render();
    remember();
  });
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) {
      restore(event.detail.globals.widgetState);
      render();
    }
  });
  restore(window.openai?.widgetState);
  render();
})();
</script>
